<style>html,body{margin:0;height:100%;background:#fff;overscroll-behavior:none}@media (prefers-color-scheme:dark){html,body{background:#0B141A}}</style>
<style id="mk-css">
/* ===== JB KU MARKET — UI gaya WhatsApp (fase 1) ===== */
#mk{--g:#1DAA61;--g2:#008069;--gd:#0A3B1F;--bg:#fff;--bg2:#F7F8FA;--hd:#fff;--ink:#111B21;--sub:#667781;--mut:#8696A0;--line:#E9EDEF;--chip:#F0F2F5;--chipon:#D8FDD2;--chiptx:#15603E;--wall:#EFEAE2;--in:#fff;--out:#D9FDD3;--lnk:#027EB5;--bad:#EA0038;--warn:#FFB400;--shadow:0 1px .5px rgba(11,20,26,.13);--pop:0 6px 24px rgba(11,20,26,.18),0 1px 3px rgba(11,20,26,.12);--dood:.06;--fab:#1DAA61;--fabtx:#fff;--seltx:#fff}
#mk[data-th="dark"]{--g:#21C063;--g2:#21C063;--gd:#D8FDD2;--bg:#0B141A;--bg2:#111B21;--hd:#0B141A;--ink:#E9EDEF;--sub:#8696A0;--mut:#667781;--line:#222D34;--chip:#202C33;--chipon:#103529;--chiptx:#D8FDD2;--wall:#0B141A;--in:#202C33;--out:#005C4B;--lnk:#53BDEB;--shadow:0 1px .5px rgba(0,0,0,.3);--pop:0 8px 28px rgba(0,0,0,.55);--dood:.05;--fab:#21C063;--fabtx:#0B141A}
#mk{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 15px/1.35 Roboto,"Helvetica Neue",Helvetica,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;transform:translateY(0);transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s;contain:layout}
#mk.mk-hide{transform:translateY(100%);opacity:.6;pointer-events:none}
#mk *,#mk *::before,#mk *::after{box-sizing:border-box}
#mk button{all:unset;box-sizing:border-box;cursor:pointer;-webkit-tap-highlight-color:transparent}
#mk button:focus-visible,#mk a:focus-visible,#mk input:focus-visible,#mk textarea:focus-visible{outline:2px solid var(--g);outline-offset:2px}
#mk input,#mk textarea,#mk select{font:inherit;color:inherit}
#mk svg{display:block}
#mk img{-webkit-user-drag:none}
#mk .mk-ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mk .mk-ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none;position:relative;overflow:hidden}
#mk .mk-rp{position:relative;overflow:hidden}
#mk .mk-ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);animation:mkRip .5s ease-out forwards;pointer-events:none}
@keyframes mkRip{to{transform:scale(1);opacity:0}}

/* ---------- top bar ---------- */
#mk .mk-top{flex:none;display:flex;align-items:center;gap:2px;height:60px;padding:calc(env(safe-area-inset-top)) 6px 0 8px;background:var(--hd);position:relative;z-index:3}
#mk .mk-brand{flex:1;display:flex;align-items:center;gap:9px;min-width:0;padding-left:8px}
#mk .mk-brand b{font-size:22px;font-weight:500;letter-spacing:-.2px;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mk .mk-brand .mk-lg{width:30px;height:30px;flex:none}
#mk .mk-top .mk-back{margin-right:-6px}

/* ---------- views ---------- */
#mk .mk-main{flex:1;min-height:0;position:relative}
#mk .mk-view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);opacity:0;visibility:hidden;transform:translateX(14px);transition:opacity .2s,transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s}
#mk .mk-view.on{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .26s cubic-bezier(.2,.8,.2,1)}
#mk .mk-search{margin:4px 16px 10px;height:46px;border-radius:24px;background:var(--chip);display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--sub)}
#mk .mk-search input{all:unset;flex:1;min-width:0;color:var(--ink);font-size:16px}
#mk .mk-search input::placeholder{color:var(--sub)}
#mk .mk-search .mk-x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
#mk .mk-search .mk-x[hidden]{display:none}
#mk .mk-chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
#mk .mk-chips::-webkit-scrollbar{display:none}
#mk .mk-chip{flex:none;height:34px;padding:0 14px;border-radius:18px;background:var(--chip);color:var(--sub);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .18s,color .18s}
#mk .mk-chip.on{background:var(--chipon);color:var(--chiptx)}
#mk .mk-chip i{font-style:normal;font-size:12px;opacity:.8}
#mk .mk-live{display:flex;align-items:center;gap:8px;padding:0 18px 8px;font-size:13px;color:var(--sub)}
#mk .mk-dot{width:8px;height:8px;border-radius:50%;background:#25D366;box-shadow:0 0 0 0 rgba(37,211,102,.6);animation:mkPulse 1.8s infinite;flex:none}
@keyframes mkPulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}70%{box-shadow:0 0 0 7px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
#mk .mk-live b{color:var(--ink);font-weight:500}

/* ---------- wallpaper + feed ---------- */
#mk .mk-wall{position:relative;min-height:calc(100% - 140px);background-color:var(--wall);padding:6px 0 96px}
#mk .mk-wall::before{content:"";position:absolute;inset:0;background-image:var(--doodle);background-size:300px 300px;opacity:var(--dood);pointer-events:none}
#mk[data-th="dark"] .mk-wall::before{filter:invert(1)}
#mk .mk-feed{position:relative;display:flex;flex-direction:column;gap:2px;padding:0 10px}
#mk .mk-day{align-self:center;margin:10px 0 6px;padding:5px 12px;border-radius:8px;background:var(--in);color:var(--sub);font-size:12.5px;font-weight:500;box-shadow:var(--shadow);text-transform:none;position:sticky;top:6px;z-index:2}
#mk .mk-sys{align-self:center;max-width:86%;margin:6px 0 8px;padding:6px 12px;border-radius:8px;background:#FFEECD;color:#54656F;font-size:12.5px;text-align:center;box-shadow:var(--shadow)}
#mk[data-th="dark"] .mk-sys{background:#182229;color:#FFD279}
#mk .mk-newp{position:sticky;top:8px;z-index:4;align-self:center;margin:-2px auto 4px;padding:8px 16px;border-radius:20px;background:var(--g);color:#fff;font-size:13.5px;font-weight:500;box-shadow:var(--pop);display:flex;gap:6px;align-items:center;animation:mkDrop .35s cubic-bezier(.2,.9,.3,1.3)}
#mk[data-th="dark"] .mk-newp{color:#0B141A}
@keyframes mkDrop{from{transform:translateY(-16px);opacity:0}}

/* ---------- bubble ---------- */
#mk .mk-bw{display:flex;align-items:flex-start;gap:6px;margin:3px 0 5px;animation:mkIn .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes mkIn{from{opacity:0;transform:translateY(10px) scale(.985)}}
#mk .mk-bav{width:32px;height:32px;border-radius:50%;flex:none;margin-top:2px;overflow:hidden;background:var(--chip);display:grid;place-items:center;font-weight:500;color:#fff;font-size:14px}
#mk .mk-bav img{width:100%;height:100%;object-fit:cover}
#mk .mk-b{position:relative;width:min(86%,420px);background:var(--in);border-radius:0 8px 8px 8px;box-shadow:var(--shadow);padding:3px}
#mk .mk-b::before{content:"";position:absolute;left:-8px;top:0;width:8px;height:13px;background:var(--in);clip-path:polygon(0 0,100% 0,100% 100%)}
#mk .mk-bh{display:flex;align-items:center;gap:6px;padding:4px 7px 5px;min-width:0}
#mk .mk-bn{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#mk .mk-tag{flex:none;font-size:10.5px;font-weight:500;letter-spacing:.2px;padding:2px 6px;border-radius:5px;background:var(--chipon);color:var(--chiptx)}
#mk .mk-tag.gs{background:var(--chip);color:var(--sub)}
#mk .mk-bh .mk-sp{flex:1}
#mk .mk-bh .mk-km{width:28px;height:28px;margin:-4px -4px -4px 0;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
#mk .mk-bh .mk-km svg{width:20px;height:20px}
#mk .mk-bt{padding:6px 8px 2px}
#mk .mk-gm{font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#mk .mk-gm small{font-weight:400;color:var(--sub);font-size:13px}
#mk .mk-pr{font-size:20px;font-weight:700;color:var(--g2);margin:3px 0 4px;letter-spacing:-.2px}
#mk[data-th="dark"] .mk-pr{color:#25D366}
#mk .mk-pills{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}
#mk .mk-pill{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--bg2);color:var(--sub);border:1px solid var(--line)}
#mk .mk-spec{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px;margin:4px 0 6px;padding:7px 9px;border-radius:7px;background:var(--bg2)}
#mk .mk-spec dt{color:var(--sub)}
#mk .mk-spec dd{margin:0;font-weight:500;word-break:break-word}
#mk .mk-cap{white-space:pre-wrap;word-break:break-word;font-size:14.5px;margin:4px 0 2px}
#mk .mk-cap.cut{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#mk .mk-more{color:var(--lnk);font-size:14px;font-weight:500;margin:2px 0}
#mk .mk-bm{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 8px 4px;font-size:11.5px;color:var(--sub)}
#mk .mk-bm span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
#mk .mk-bm svg{width:14px;height:14px}
#mk .mk-bm .mk-tk svg{width:16px;height:11px;fill:none;stroke:#53BDEB;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#mk .mk-bm .mk-clk svg{width:13px;height:13px;stroke:var(--sub)}
#mk .mk-ba{display:flex;border-top:1px solid var(--line);margin:4px -3px -3px}
#mk .mk-ba button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:42px;color:var(--lnk);font-size:14.5px;font-weight:500}
#mk .mk-ba button+button{border-left:1px solid var(--line)}
#mk .mk-ba svg{width:19px;height:19px}
#mk .mk-b.sold .mk-al{filter:grayscale(.7)}
#mk .mk-stamp{position:absolute;top:14px;right:12px;z-index:2;padding:4px 10px;border:2.5px solid var(--bad);color:var(--bad);border-radius:6px;font-weight:900;font-size:14px;letter-spacing:1.5px;transform:rotate(8deg);background:rgba(255,255,255,.85)}
#mk[data-th="dark"] .mk-stamp{background:rgba(11,20,26,.8)}
#mk .mk-b.tmp{opacity:.92}

/* ---------- album (ukuran menyesuaikan) ---------- */
#mk .mk-al{display:grid;gap:3px;border-radius:6px;overflow:hidden;position:relative;background:var(--bg2)}
#mk .mk-al.n2{grid-template-columns:1fr 1fr}
#mk .mk-al.n3{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
#mk .mk-al.n3 .mk-ph:first-child{grid-column:1/3}
#mk .mk-al.n4{grid-template-columns:1fr 1fr}
#mk .mk-ph{position:relative;overflow:hidden;background:var(--chip);min-height:60px}
#mk .mk-al.n2 .mk-ph,#mk .mk-al.n4 .mk-ph,#mk .mk-al.n3 .mk-ph:not(:first-child){aspect-ratio:1}
#mk .mk-al.n3 .mk-ph:first-child{aspect-ratio:16/10}
#mk .mk-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
#mk .mk-al.n1 .mk-ph{max-height:420px}
#mk .mk-ph img.ok{opacity:1}
#mk .mk-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%) var(--chip);background-size:220% 100%;animation:mkSh 1.3s infinite linear;pointer-events:none;transition:opacity .3s}
#mk[data-th="dark"] .mk-ph::after{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%) var(--chip);background-size:220% 100%}
#mk .mk-ph.ok::after{opacity:0}
@keyframes mkSh{from{background-position:120% 0}to{background-position:-120% 0}}
#mk .mk-ph .mk-plus{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(11,20,26,.5);color:#fff;font-size:30px;font-weight:400}
#mk .mk-al .mk-cnt{position:absolute;right:6px;bottom:6px;z-index:2;padding:2px 7px;border-radius:10px;background:rgba(11,20,26,.55);color:#fff;font-size:11.5px;display:flex;gap:4px;align-items:center}
#mk .mk-al .mk-cnt svg{width:13px;height:13px}
#mk .mk-prog{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:rgba(11,20,26,.35)}
#mk .mk-ring{width:52px;height:52px;border-radius:50%;background:conic-gradient(#fff calc(var(--p,0)*1%),rgba(255,255,255,.25) 0);display:grid;place-items:center;transition:--p .3s}
#mk .mk-ring::before{content:"";width:44px;height:44px;border-radius:50%;background:rgba(11,20,26,.55)}
#mk .mk-prog small{position:absolute;bottom:10px;color:#fff;font-size:12px;font-weight:500;text-shadow:0 1px 2px rgba(0,0,0,.4)}

/* ---------- list rows (tab Toko) ---------- */
#mk .mk-row{display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:72px;width:100%}
#mk .mk-row:active{background:var(--bg2)}
#mk .mk-av{width:52px;height:52px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:500;background:#DFE5E7}
#mk .mk-av img{width:100%;height:100%;object-fit:cover}
#mk .mk-rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#mk .mk-rt{display:flex;align-items:center;gap:6px}
#mk .mk-rt b{font-size:16.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
#mk .mk-rt time{font-size:12px;color:var(--sub);flex:none}
#mk .mk-rt time.g{color:var(--g)}
#mk .mk-rs{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:14px}
#mk .mk-rs span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
#mk .mk-rs svg{width:16px;height:16px;flex:none}
#mk .mk-badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#25D366;color:#fff;font-size:12px;font-weight:500;display:grid;place-items:center;flex:none}
#mk[data-th="dark"] .mk-badge{color:#0B141A}
#mk .mk-sec{padding:16px 16px 8px;font-size:14px;font-weight:500;color:var(--sub)}
#mk .mk-empty{padding:48px 32px;text-align:center;color:var(--sub);font-size:14.5px;line-height:1.5}
#mk .mk-empty b{display:block;color:var(--ink);font-size:17px;font-weight:500;margin:12px 0 4px}
#mk .mk-empty .mk-ei{width:84px;height:84px;margin:0 auto;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--g)}
#mk .mk-empty .mk-ei svg{width:40px;height:40px}
#mk .mk-skel{height:14px;border-radius:7px;background:linear-gradient(100deg,var(--chip) 30%,var(--bg2) 50%,var(--chip) 70%);background-size:220% 100%;animation:mkSh 1.3s infinite linear}

/* ---------- bottom nav + fab ---------- */
#mk .mk-nav{flex:none;display:flex;justify-content:space-around;align-items:flex-start;height:calc(78px + env(safe-area-inset-bottom));padding:10px 4px env(safe-area-inset-bottom);background:var(--hd);border-top:1px solid var(--line);position:relative;z-index:3}
#mk .mk-nav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:500;color:var(--ink)}
#mk .mk-nav .mk-ni{position:relative;width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .25s}
#mk .mk-nav .mk-ni::before{content:"";position:absolute;inset:0;border-radius:16px;background:var(--chipon);transform:scaleX(.3);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
#mk .mk-nav .on .mk-ni::before{transform:none;opacity:1}
#mk .mk-nav .mk-ni svg{position:relative;width:24px;height:24px}
#mk .mk-nav .on{font-weight:700}
#mk .mk-nav .on .mk-ni{color:var(--chiptx)}
#mk .mk-nav .mk-nb{position:absolute;top:-3px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#25D366;color:#fff;font-size:11px;display:grid;place-items:center;font-weight:500}
#mk .mk-fab{position:absolute;right:16px;bottom:16px;z-index:4;width:56px;height:56px;border-radius:16px;background:var(--fab);color:var(--fabtx);display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.22);transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s}
#mk .mk-fab.off{transform:scale(0);opacity:0;pointer-events:none}
#mk .mk-fab svg{width:26px;height:26px}
#mk .mk-fab:active{transform:scale(.93)}

/* ---------- popup menu ---------- */
#mk .mk-scrim{position:absolute;inset:0;z-index:50}
#mk .mk-menu{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:51;min-width:220px;padding:8px 0;border-radius:12px;background:var(--bg);box-shadow:var(--pop);transform-origin:top right;animation:mkMenu .18s cubic-bezier(.2,.8,.2,1)}
#mk[data-th="dark"] .mk-menu{background:#233138}
@keyframes mkMenu{from{transform:scale(.6);opacity:0}}
#mk .mk-menu button{display:flex;align-items:center;gap:14px;width:100%;height:48px;padding:0 20px;font-size:15.5px}
#mk .mk-menu button:active{background:var(--bg2)}
#mk .mk-menu svg{width:20px;height:20px;color:var(--sub)}

/* ---------- pages (slide) ---------- */
#mk .mk-page{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:-6px 0 24px rgba(0,0,0,.12);will-change:transform}
#mk .mk-page.on{transform:none}
#mk .mk-page.under{transform:translateX(-22%)}
#mk .mk-ph2{flex:none;display:flex;align-items:center;gap:4px;height:calc(60px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 6px 0 4px;background:var(--hd);border-bottom:1px solid var(--line)}
#mk .mk-ph2.g{background:var(--g2);color:#fff;border:0}
#mk[data-th="dark"] .mk-ph2.g{background:#1F2C34;color:var(--ink)}
#mk .mk-ph2.g .mk-ib{color:inherit}
#mk .mk-ph2 .mk-pt{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
#mk .mk-ph2 .mk-pt>div{min-width:0}
#mk .mk-ph2 .mk-pt b{display:block;font-size:17.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mk .mk-ph2 .mk-pt small{display:block;font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mk .mk-ph2 .mk-av{width:40px;height:40px;font-size:16px}
#mk .mk-pb{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
#mk .mk-pf{flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--hd);border-top:1px solid var(--line)}

/* ---------- buttons / forms ---------- */
#mk .mk-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:24px;background:var(--g);color:#fff;font-weight:500;font-size:15.5px;transition:transform .15s,filter .15s}
#mk[data-th="dark"] .mk-btn{color:#0B141A}
#mk .mk-btn:active{transform:scale(.97);filter:brightness(.95)}
#mk .mk-btn.ghost{background:transparent;color:var(--g2);border:1px solid var(--line)}
#mk[data-th="dark"] .mk-btn.ghost{color:var(--g)}
#mk .mk-btn.bad{background:transparent;color:var(--bad);border:1px solid var(--line)}
#mk .mk-btn.blk{width:100%}
#mk .mk-btn[disabled]{opacity:.5;pointer-events:none}
#mk .mk-btn svg{width:20px;height:20px}
#mk .mk-fld{display:block;margin:0 16px 18px}
#mk .mk-fld>span{display:block;font-size:13px;color:var(--g2);font-weight:500;margin-bottom:4px}
#mk[data-th="dark"] .mk-fld>span{color:var(--g)}
#mk .mk-fld input,#mk .mk-fld textarea,#mk .mk-fld select{display:block;width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;padding:8px 2px;font-size:16px;outline:0;border-radius:0;transition:border-color .2s}
#mk .mk-fld textarea{resize:none;min-height:84px;line-height:1.4}
#mk .mk-fld input:focus,#mk .mk-fld textarea:focus,#mk .mk-fld select:focus{border-color:var(--g)}
#mk .mk-fld select option{background:var(--bg);color:var(--ink)}
#mk .mk-two{display:grid;grid-template-columns:1fr 1fr;gap:0}
#mk .mk-two .mk-fld:first-child{margin-right:8px}
#mk .mk-two .mk-fld:last-child{margin-left:8px}
#mk .mk-hint{margin:-10px 16px 16px;font-size:12.5px;color:var(--sub)}

/* ---------- composer (pilih stok) ---------- */
#mk .mk-sel{display:flex;gap:12px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line);scrollbar-width:none;min-height:0}
#mk .mk-sel::-webkit-scrollbar{display:none}
#mk .mk-sel:empty{display:none}
#mk .mk-sel>button{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--sub);animation:mkPop .25s cubic-bezier(.2,.9,.3,1.4)}
@keyframes mkPop{from{transform:scale(.4);opacity:0}}
#mk .mk-sel>button span{width:52px;height:52px;border-radius:50%;overflow:hidden;position:relative;background:var(--chip)}
#mk .mk-sel>button span img{width:100%;height:100%;object-fit:cover}
#mk .mk-sel>button span i{position:absolute;right:-1px;bottom:-1px;width:20px;height:20px;border-radius:50%;background:#8696A0;color:#fff;border:2px solid var(--bg);display:grid;place-items:center;font-style:normal;font-size:12px;line-height:1}
#mk .mk-sel>button em{font-style:normal;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mk .mk-pick{display:flex;align-items:center;gap:14px;padding:9px 16px;width:100%;transition:background .15s}
#mk .mk-pick:active{background:var(--bg2)}
#mk .mk-pick .mk-th{width:52px;height:52px;border-radius:50%;flex:none;position:relative;background:var(--chip)}
#mk .mk-pick .mk-th img{width:100%;height:100%;border-radius:50%;object-fit:cover}
#mk .mk-pick .mk-ck{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--g);color:#fff;border:2px solid var(--bg);display:grid;place-items:center;transform:scale(0);transition:transform .22s cubic-bezier(.2,.9,.3,1.5)}
#mk .mk-pick .mk-ck svg{width:12px;height:12px;stroke-width:3.4}
#mk .mk-pick.on .mk-ck{transform:scale(1)}
#mk .mk-pick.on{background:color-mix(in srgb,var(--g) 7%,transparent)}
#mk .mk-pick .mk-rb small{color:var(--sub);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mk .mk-pick .mk-rb b{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mk .mk-pick .mk-done{font-size:11px;color:var(--g2);font-weight:500;flex:none;text-align:right}
#mk[data-th="dark"] .mk-pick .mk-done{color:var(--g)}
#mk .mk-cmp{display:flex;align-items:flex-end;gap:8px}
#mk .mk-cmp .mk-inp{flex:1;min-height:48px;display:flex;align-items:center;border-radius:24px;background:var(--bg);border:1px solid var(--line);padding:0 16px}
#mk[data-th="dark"] .mk-cmp .mk-inp{background:#2A3942;border:0}
#mk .mk-cmp textarea{all:unset;flex:1;max-height:110px;padding:13px 0;font-size:16px;line-height:1.35;white-space:pre-wrap;overflow-y:auto}
#mk .mk-send{width:48px;height:48px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;flex:none;position:relative;transition:transform .2s cubic-bezier(.2,.9,.3,1.4)}
#mk[data-th="dark"] .mk-send{color:#0B141A}
#mk .mk-send[disabled]{opacity:.45;pointer-events:none}
#mk .mk-send:active{transform:scale(.9)}
#mk .mk-send svg{width:22px;height:22px;fill:currentColor;stroke:none;margin-left:3px}
#mk .mk-send i{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;color:var(--g2);font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
#mk .mk-selbar{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13.5px;color:var(--sub)}
#mk .mk-selbar button{color:var(--g2);font-weight:500}
#mk[data-th="dark"] .mk-selbar button{color:var(--g)}

/* ---------- guest upload grid ---------- */
#mk .mk-ug{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 16px 18px}
#mk .mk-ug>*{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--chip)}
#mk .mk-ug img{width:100%;height:100%;object-fit:cover;animation:mkPop .25s}
#mk .mk-ug .mk-ux{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(11,20,26,.6);color:#fff;display:grid;place-items:center}
#mk .mk-ug .mk-ux svg{width:14px;height:14px;stroke-width:2.6}
#mk .mk-ug .mk-ua{display:grid;place-items:center;color:var(--g2);border:2px dashed var(--line);background:transparent}
#mk .mk-ug .mk-ua div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:500}

/* ---------- detail ---------- */
#mk .mk-dimg{display:flex;flex-direction:column;gap:3px;background:#000}
#mk .mk-dimg button{display:block;position:relative;background:#111}
#mk .mk-dimg img{display:block;width:100%;height:auto;opacity:0;transition:opacity .35s}
#mk .mk-dimg img.ok{opacity:1}
#mk .mk-dcard{padding:16px;border-bottom:8px solid var(--bg2)}
#mk .mk-dcard h2{margin:0 0 2px;font-size:20px;font-weight:500}
#mk .mk-dcard .mk-pr{font-size:26px}
#mk .mk-watch{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:6px 12px;border-radius:16px;background:var(--chipon);color:var(--chiptx);font-size:13px;font-weight:500}
#mk .mk-watch svg{width:16px;height:16px}
#mk .mk-seller{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:8px solid var(--bg2);width:100%}
#mk .mk-seller .mk-av{width:46px;height:46px;font-size:18px}
#mk .mk-seller .mk-rb small{color:var(--sub);font-size:13px}

/* ---------- profile / saya ---------- */
#mk .mk-prof{display:flex;flex-direction:column;align-items:center;padding:20px 16px 18px;border-bottom:8px solid var(--bg2);text-align:center}
#mk .mk-prof .mk-av{width:96px;height:96px;font-size:36px;margin-bottom:10px}
#mk .mk-prof b{font-size:22px;font-weight:500}
#mk .mk-prof small{color:var(--sub);font-size:14px;margin-top:2px}
#mk .mk-stats{display:flex;gap:10px;margin-top:14px;width:100%;max-width:420px}
#mk .mk-stats div{flex:1;padding:10px 6px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
#mk .mk-stats b{font-size:18px;font-weight:700}
#mk .mk-stats span{font-size:12px;color:var(--sub)}
#mk .mk-link{margin:14px 16px;padding:14px;border-radius:14px;background:var(--bg2);display:flex;flex-direction:column;gap:10px}
#mk .mk-link .mk-lu{font-size:13.5px;word-break:break-all;color:var(--lnk);font-family:ui-monospace,Menlo,monospace}
#mk .mk-link .mk-lt{display:flex;align-items:center;gap:10px;font-weight:500}
#mk .mk-link .mk-lt svg{width:22px;height:22px;color:var(--g2)}
#mk .mk-mine{display:flex;gap:12px;padding:10px 16px;align-items:center;border-bottom:1px solid var(--line)}
#mk .mk-mine .mk-mt{width:64px;height:64px;border-radius:10px;overflow:hidden;flex:none;background:var(--chip)}
#mk .mk-mine .mk-mt img{width:100%;height:100%;object-fit:cover}
#mk .mk-mine .mk-rb small{font-size:12.5px;color:var(--sub)}
#mk .mk-mine .mk-rb b{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mk .mk-mine .mk-st{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--chipon);color:var(--chiptx);align-self:flex-start}
#mk .mk-mine .mk-st.s{background:#FFE1E6;color:var(--bad)}
#mk[data-th="dark"] .mk-mine .mk-st.s{background:#3a1720}

/* ---------- admin table ---------- */
#mk .mk-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px}
#mk .mk-kpi div{padding:12px 8px;border-radius:12px;background:var(--bg2);text-align:center}
#mk .mk-kpi b{display:block;font-size:20px;font-weight:700}
#mk .mk-kpi span{font-size:11.5px;color:var(--sub)}
#mk .mk-gr{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
#mk .mk-gr .mk-av{width:44px;height:44px;font-size:17px}
#mk .mk-gr .mk-rb small{font-size:12.5px;color:var(--sub)}
#mk .mk-gr .mk-lc{flex:none;text-align:right;font-size:12px;color:var(--sub)}
#mk .mk-gr .mk-lc b{display:block;font-size:17px;color:var(--ink);font-weight:700}
#mk .mk-on{display:inline-block;width:8px;height:8px;border-radius:50%;background:#25D366;margin-right:4px;vertical-align:1px}

/* ---------- welcome / login (web guest) ---------- */
#mk .mk-splash{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity .35s}
#mk .mk-splash.out{opacity:0;pointer-events:none}
#mk .mk-splash .mk-lg{width:84px;height:84px;animation:mkLogo .7s cubic-bezier(.2,.9,.3,1.3)}
@keyframes mkLogo{from{transform:scale(.5);opacity:0}}
#mk .mk-splash .mk-from{position:absolute;bottom:calc(42px + env(safe-area-inset-bottom));text-align:center;color:var(--sub);font-size:14px}
#mk .mk-splash .mk-from b{display:block;color:var(--g);font-size:16px;font-weight:500;letter-spacing:1px;margin-top:2px}
#mk .mk-wel{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;background:var(--bg);overflow-y:auto;padding:calc(40px + env(safe-area-inset-top)) 28px calc(24px + env(safe-area-inset-bottom));text-align:center}
#mk .mk-wel .mk-hero{width:min(260px,64vw);aspect-ratio:1;border-radius:50%;background:var(--chipon);display:grid;place-items:center;margin:20px 0 34px;position:relative}
#mk .mk-wel .mk-hero .mk-lg{width:46%;height:46%}
#mk .mk-wel .mk-hero i{position:absolute;border-radius:50%;background:var(--g);opacity:.18}
#mk .mk-wel h1{margin:0 0 14px;font-size:26px;font-weight:500;line-height:1.25}
#mk .mk-wel p{margin:0 0 10px;color:var(--sub);font-size:14px;line-height:1.5;max-width:360px}
#mk .mk-wel p b{color:var(--lnk);font-weight:400}
#mk .mk-wel .mk-sp{flex:1}
#mk .mk-wel .mk-btn{width:100%;max-width:360px;margin-top:18px}
#mk .mk-wel h2{margin:4px 0 14px;font-size:20px;font-weight:500;color:var(--g2)}
#mk[data-th="dark"] .mk-wel h2{color:var(--g)}
#mk .mk-at{display:flex;align-items:center;gap:6px;width:100%;max-width:300px;margin:18px auto 6px;border-bottom:2px solid var(--g);padding:6px 2px;font-size:20px}
#mk .mk-at span{color:var(--sub)}
#mk .mk-at input{all:unset;flex:1;min-width:0;font-size:20px;letter-spacing:.2px}
#mk .mk-err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
#mk .mk-wel .mk-fx{animation:mkIn .45s cubic-bezier(.2,.8,.2,1) both}

/* ---------- viewer ---------- */
#mk .mk-vw{position:absolute;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;color:#fff;touch-action:none;animation:mkFade .2s}
@keyframes mkFade{from{opacity:0}}
#mk .mk-vw .mk-vh{position:relative;z-index:2;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 6px 6px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
#mk .mk-vw .mk-vh .mk-ib{color:#fff}
#mk .mk-vw .mk-vh div{flex:1;min-width:0}
#mk .mk-vw .mk-vh b{display:block;font-size:16.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mk .mk-vw .mk-vh small{font-size:12.5px;opacity:.75}
#mk .mk-vw .mk-vp{position:absolute;inset:0;overflow:hidden}
#mk .mk-vw .mk-vt{display:flex;height:100%;will-change:transform}
#mk .mk-vw .mk-vs{flex:0 0 100%;height:100%;display:grid;place-items:center;overflow:hidden;position:relative}
#mk .mk-vw .mk-vs img{max-width:100%;max-height:100%;transform-origin:0 0;will-change:transform;pointer-events:none;user-select:none}
#mk .mk-vw .mk-vf{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;gap:6px;justify-content:center;padding:10px 10px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6));overflow-x:auto}
#mk .mk-vw .mk-vf button{flex:none;width:46px;height:46px;border-radius:6px;overflow:hidden;opacity:.5;border:2px solid transparent;transition:opacity .2s}
#mk .mk-vw .mk-vf button.on{opacity:1;border-color:#fff}
#mk .mk-vw .mk-vf img{width:100%;height:100%;object-fit:cover}

/* ---------- toast + sheet ---------- */
#mk .mk-toast{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:200;transform:translate(-50%,20px);max-width:calc(100% - 32px);padding:12px 18px;border-radius:8px;background:#323739;color:#fff;font-size:14.5px;box-shadow:var(--pop);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
#mk .mk-toast.on{opacity:1;transform:translate(-50%,0)}
#mk .mk-toast.err{background:#B3261E}
#mk .mk-sh{position:absolute;inset:0;z-index:120;background:rgba(11,20,26,.4);display:flex;align-items:flex-end;animation:mkFade .2s}
#mk .mk-sh.out{opacity:0;transition:opacity .2s}
#mk .mk-shb{width:100%;max-height:86%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 0 calc(12px + env(safe-area-inset-bottom));animation:mkUp .28s cubic-bezier(.2,.8,.2,1)}
#mk[data-th="dark"] .mk-shb{background:#1F2C34}
@keyframes mkUp{from{transform:translateY(100%)}}
#mk .mk-shb .mk-grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
#mk .mk-shb h3{margin:4px 22px 12px;font-size:18px;font-weight:500}
#mk .mk-shb p{margin:0 22px 16px;color:var(--sub);font-size:14.5px;line-height:1.45}
#mk .mk-shb .mk-sa{display:flex;flex-direction:column}
#mk .mk-shb .mk-sa button{display:flex;align-items:center;gap:18px;height:54px;padding:0 22px;font-size:16px}
#mk .mk-shb .mk-sa button:active{background:var(--bg2)}
#mk .mk-shb .mk-sa svg{width:22px;height:22px;color:var(--sub)}
#mk .mk-shb .mk-sa .bad,#mk .mk-shb .mk-sa .bad svg{color:var(--bad)}
#mk .mk-shb .mk-row2{display:flex;gap:10px;padding:0 16px}
#mk .mk-shb .mk-row2 .mk-btn{flex:1}
#mk .mk-sentinel{height:1px}
#mk .mk-loadm{display:flex;justify-content:center;padding:16px}
#mk .mk-spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--g);animation:mkRot .8s linear infinite}
@keyframes mkRot{to{transform:rotate(360deg)}}
@media (min-width:760px){#mk .mk-feed{max-width:720px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){#mk *,#mk *::before,#mk *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===================== FASE 2/3: CHAT ===================== */
#mk .mk-nav .mk-nb{top:-4px;right:2px;z-index:2}
#mk .mk-nav .mk-nb[hidden]{display:none}
#mk .mk-vt{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-left:3px;flex:none}
#mk .mk-role{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.2px;padding:2px 7px;border-radius:999px;color:#fff;background:var(--rc);vertical-align:1px;white-space:nowrap}
#mk .mk-gav{background:linear-gradient(135deg,#1D9BF0,#0b6bcb)!important;color:#fff}
#mk .mk-gav svg{width:55%;height:55%}
#mk .mk-typ{color:var(--g)!important;font-weight:500}
#mk .mk-rs .mk-tk svg,#mk .mk-mt .mk-tk svg{width:16px;height:11px;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#mk .mk-tk.sn svg{stroke:var(--sub)}#mk .mk-tk.rd svg{stroke:#53BDEB}
#mk .mk-rs .mk-vt{width:15px;height:15px;margin:0 2px 0 0}
#mk .mk-adm-pv{color:#1D9BF0;font-weight:500}
#mk .mk-pin{color:var(--mut);display:flex}#mk .mk-pin svg{width:15px;height:15px}

/* header chat */
#mk .mk-chd .mk-pt{cursor:pointer;text-align:left}
#mk .mk-chd small{font-size:13px}
#mk .mk-dots{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
#mk .mk-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:mkDot 1.2s infinite ease-in-out}
#mk .mk-dots i:nth-child(2){animation-delay:.15s}#mk .mk-dots i:nth-child(3){animation-delay:.3s}
#mk .mk-dots.big i{width:7px;height:7px;background:var(--mut)}
@keyframes mkDot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}

/* area pesan */
#mk .mk-cw{background-color:var(--wall);position:relative;scroll-behavior:auto}
#mk .mk-cw::before{content:"";position:fixed;inset:0;background-image:var(--doodle);background-size:300px 300px;opacity:var(--dood);pointer-events:none}
#mk[data-th="dark"] .mk-cw::before{filter:invert(1)}
#mk .mk-cl{position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 4% 6px;gap:1px;min-height:calc(100% - 14px)}
#mk .mk-cl .mk-day{position:relative;top:0}
#mk .mk-mw{display:flex;margin-top:1px;position:relative}
#mk .mk-mw.first{margin-top:8px}
#mk .mk-mw.out{justify-content:flex-end}
#mk .mk-m{position:relative;max-width:min(80%,520px);padding:6px 8px 7px 9px;border-radius:8px;background:var(--in);box-shadow:var(--shadow);font-size:15.2px;line-height:1.36;word-break:break-word;letter-spacing:.05px}
#mk .out .mk-m{background:var(--out)}
#mk .mk-mw.first.in .mk-m{border-top-left-radius:0}
#mk .mk-mw.first.out .mk-m{border-top-right-radius:0}
#mk .mk-mw.first.in .mk-m::before,#mk .mk-mw.first.out .mk-m::before{content:"";position:absolute;top:0;width:8px;height:13px;background:inherit}
#mk .mk-mw.first.in .mk-m::before{left:-8px;clip-path:polygon(0 0,100% 0,100% 100%)}
#mk .mk-mw.first.out .mk-m::before{right:-8px;clip-path:polygon(0 0,100% 0,0 100%)}
#mk .mk-mtx{white-space:pre-wrap}
#mk .mk-mtx a{color:var(--lnk)}
#mk .mk-mt{float:right;margin:8px 0 -5px 10px;font-size:11px;color:var(--sub);display:inline-flex;align-items:center;gap:3px;line-height:1;position:relative;top:2px}
#mk[data-th="dark"] .out .mk-mt{color:#8fb7ae}
#mk .mk-mt .mk-clk svg{width:12px;height:12px}
#mk .mk-fail{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--bad);color:#fff;font-weight:900;font-size:11px;cursor:pointer}

  function rowFromStock(s, cap) {

  async function sendStocks(items, cap) {
    if (!items.length) return;
    switchTab('pasar'); S.q = ''; S.game = ''; const si = $('#mkQ'); if (si) si.value = ''; paintChips();
    if (S.mine == null) await loadMine();
    const posted = new Map((S.mine || []).filter(x => x.stock_id).map(x => [String(x.stock_id), x]));
    const now = () => new Date().toISOString();
    const jobs = items.map(s => { const row = rowFromStock(s, cap), t = { ...row, id: 'tmp' + uuid(), images: (s.images || []).slice(0, 10).map(u => ({ t: u, u })), views: 0, created_at: now(), bumped_at: now(), _tmp: 1, _prog: { p: 0, t: 'Menunggu…' } }; return { s, row, t }; });
    S.tmp = jobs.map(j => j.t).reverse().concat(S.tmp); paintFeed(); const v = $('[data-view="pasar"]'); if (v) v.scrollTop = 0;
    let ok = 0, fail = 0;
    for (const j of jobs) {
      const prog = (p, t) => { j.t._prog = { p, t }; const el = $(`.mk-bw[data-id="${j.t.id}"] .mk-prog`); if (el) { $('.mk-ring', el).style.setProperty('--p', p); $('small', el).textContent = t; } };
      try {
        const ex = posted.get(String(j.s.id)), sig = sigOf(j.s), src = (j.s.images || []).slice(0, 10);
        let images = ex && ex.sig === sig ? ex.images : null;
        if (!images) { images = []; const base = `${me.id}/${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`; for (let i = 0; i < src.length; i++) { prog(Math.round(i / Math.max(1, src.length) * 92), `Mengirim foto ${i + 1}/${src.length}`); images.push(await upImage(src[i], base, i)); } }

        let saved;
        if (ex) { saved = (await rest('mk_posts?id=eq.' + ex.id, { method: 'PATCH', headers: { Prefer: 'return=representation' }, body }))[0]; if (ex.sig !== sig) delImages(ex); }
        else saved = (await rest('mk_posts', { method: 'POST', headers: { Prefer: 'return=representation' }, body }))[0];

        ok++; paintFeed();
      } catch (e) { fail++; S.tmp = S.tmp.filter(x => x !== j.t); paintFeed(); toast(`Gagal kirim ${j.s.code || j.s.game}: ${errMsg(e)}`, 1); }
    }
    if (ok) { toast(ok === 1 ? 'Postingan terkirim ✓' : `${ok} postingan terkirim ✓`); buzz(20); beep('send'); }
    S.stores = null; loadMine(); loadGames();
  }

  /* ---------- sinkron stok → postingan (harga/status/dihapus) ---------- */
  async function reconcile() {
    if (!me || me.kind !== 'member' || !H.allStocks) return;
    if (S.mine == null) await loadMine();
    const all = H.allStocks(); if (!all.length) return; /* HP ini belum punya data stok (HP lain / data belum termuat): jangan sentuh postingan */
    const st = new Map(all.map(s => [String(s.id), s])), now = new Date().toISOString();
    for (const p of (S.mine || []).filter(x => x.stock_id)) {
      const s = st.get(String(p.stock_id)); if (!s) continue; /* stok tidak ada di HP ini ≠ dihapus → postingan dibiarkan */
      try {
        if (s.deleted) { await rest('mk_posts?id=eq.' + p.id, { method: 'DELETE' }); delImages(p); S.mine = S.mine.filter(x => x !== p); continue; }
        const want = { status: s.status === 'sold' ? 'sold' : 'ready', price: +(s.status === 'sold' ? (s.soldPrice || s.price) : s.price) || 0, game: s.game || '', code: s.code || '', bind: s.bind || '' };
        const diff = Object.keys(want).filter(k => String(p[k] ?? '') !== String(want[k]));
        if (diff.length) { await rest('mk_posts?id=eq.' + p.id, { method: 'PATCH', body: { ...want, updated_at: now } }); Object.assign(p, want); }
      } catch (e) { }
    }
    paintMine();
  }
  MK.reconcile = () => reconcile().catch(() => { });

<div class="mk-cf" style="background:transparent;border:0"><div class="mk-inp2" style="background:#1f2c34;color:#fff"><textarea id="mkPvc" rows="1" placeholder="Tambah keterangan…" maxlength="1000" style="color:#fff"></textarea></div><button class="mk-send" data-pv="send" aria-label="Kirim">${SEND}</button></div>`;

  async function vidMeta(url) { return new Promise(res => { const vd = document.createElement('video'); vd.preload = 'metadata'; vd.muted = true; vd.onloadedmetadata = () => res({ w: vd.videoWidth, h: vd.videoHeight, d: vd.duration || 0 }); vd.onerror = () => res({}); vd.src = url; setTimeout(() => res({}), 5000); }); }
  async function sendMedia(v, files, urls, kind, cap) {
    setState(kind === 'video' ? 'video' : 'photo');
    const jobs = [];
    for (let i = 0; i < files.length; i++) {
      let media = { u: urls[i], t: urls[i] };
      if (kind === 'video') Object.assign(media, await vidMeta(urls[i]));
      else { try { const im = await new Promise((r, j) => { const x = new Image(); x.onload = () => r(x); x.onerror = j; x.src = urls[i]; }); media.w = im.naturalWidth; media.h = im.naturalHeight; } catch (e) { } }
      const m = localMsg(v, kind, i === files.length - 1 ? cap : '', media); m._p = 3; appendMsg(v, m, false); jobs.push([m, files[i]]);
    }
    for (const [m, f] of jobs) {
      const prog = p => { m._p = p; const r = $(`[data-mid="${CSS.escape(m.id)}"] .mk-ring`, v.pg.el); if (r) r.style.setProperty('--p', p); };
      try {
        const base = `chat/${v.c.id}/${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
        if (kind === 'video') { prog(20); const ext = (f.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4'; const u = await putObj(`${base}.${ext}`, f, f.type || 'video/mp4'); m.media = { ...m.media, u, t: u, size: f.size }; }
        else { prog(30); const r = await upImage(f, base, 0); m.media = { ...m.media, ...r }; }
        prog(90); await insertMsg(v, m);
      } catch (e) { m._pend = 0; m._fail = 1; updMsg(v, m); toast('Gagal kirim ' + (kind === 'video' ? 'video' : 'foto') + ': ' + errMsg(e), 1); }
    }
    setState('view');
  }

      if (k.dataset.k === 'save') {
        const row = { owner_id: a.owner_id, name: $('#aN', pg.el).value.trim() || a.name, avatar: a.avatar || '', role: $('#aR', pg.el) ? $('#aR', pg.el).value : a.role, bio: $('#aB', pg.el).value.trim(), qris, active: $('#aA', pg.el) ? $('#aA', pg.el).checked : a.active !== false, sort: a.sort || 0 };
        try { await rest('mk_admins?on_conflict=owner_id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: [row] }); await loadAdmins(); toast('Tersimpan ✓'); H.goBack(pg); done && done(); }
        catch (er) { toast(errMsg(er), 1); }
      }
    });
  }
  async function openFeeEditor() {
    await loadFee(); let rows = JSON.parse(JSON.stringify(CH.fee || []));
    const pg = page(pageHead('Tarif admin', 'Dibayar buyer · berlaku untuk OP baru') + `<div class="mk-pb"><p class="mk-hint" style="margin:14px 16px">Tier dipilih dari "mulai harga" terbesar yang ≤ harga OP. Isi nominal Rp atau persen.</p><div id="fL"></div><button class="mk-btn ghost" data-k="add" style="margin:8px 16px">${ic('plus')}Tambah tier</button><div class="mk-sec">Simulasi</div><label class="mk-fld"><span>Harga OP</span><input id="fS" inputmode="numeric" value="250.000"></label><div class="mk-hint" id="fR"></div></div><div class="mk-pf"><button class="mk-btn blk" data-k="save">${ic('check')}Simpan tarif</button></div>`);
    const paint = () => {
      $('#fL', pg.el).innerHTML = rows.map((r, i) => `<div class="mk-fee" data-i="${i}"><label><small>Mulai harga</small><input data-f="min" inputmode="numeric" value="${(+r.min || 0).toLocaleString('id-ID')}"></label><label><small>Tipe</small><select data-f="t"><option value="fee" ${r.pct == null ? 'selected' : ''}>Rp</option><option value="pct" ${r.pct != null ? 'selected' : ''}>%</option></select></label><label><small>Nilai</small><input data-f="v" inputmode="decimal" value="${r.pct != null ? r.pct : (+r.fee || 0).toLocaleString('id-ID')}"></label><button class="mk-ib sm" data-rm="${i}" aria-label="Hapus">${ic('trash')}</button></div>`).join('');
      sim();
    };
    const read = () => { rows = $$('.mk-fee', pg.el).map(el => { const min = num($('[data-f="min"]', el).value), t = $('[data-f="t"]', el).value, v = $('[data-f="v"]', el).value; return t === 'pct' ? { min, pct: Math.max(0, Math.min(50, parseFloat(String(v).replace(',', '.')) || 0)) } : { min, fee: num(v) }; }); };
    const sim = () => { const p = num($('#fS', pg.el).value), old = CH.fee; CH.fee = rows; const f = feeOf(p); CH.fee = old; $('#fR', pg.el).innerHTML = `Harga ${rp(p)} → tarif <b>${rp(f)}</b> → buyer transfer <b>${rp(p + f)}</b>`; };
    paint();
    pg.el.addEventListener('input', e => { if (e.target.closest('.mk-fee') || e.target.id === 'fS') { read(); sim(); } });
    pg.el.addEventListener('click', async e => {
      const rm = e.target.closest('[data-rm]'); if (rm) { read(); rows.splice(+rm.dataset.rm, 1); return paint(); }
      const k = e.target.closest('[data-k]'); if (!k) return;
      if (k.dataset.k === 'add') { read(); rows.push({ min: ((rows[rows.length - 1] || {}).min || 0) + 500000, fee: 20000 }); return paint(); }
      if (k.dataset.k === 'save') { read(); rows.sort((a, b) => a.min - b.min); if (!rows.length || rows[0].min !== 0) rows.unshift({ min: 0, fee: rows[0] ? (rows[0].fee || 0) : 0 }); try { await rest('mk_settings?key=eq.fee', { method: 'PATCH', body: { value: rows } }); CH.fee = rows; toast('Tarif disimpan ✓'); H.goBack(pg); } catch (er) { toast(errMsg(er), 1); } }
    });
  }

  /* ---------- tab Chat ---------- */
  function chatView() {
    return `<section class="mk-view" data-view="chat"><div class="mk-search">${ic('search')}<input id="mkCq" type="search" placeholder="Cari chat…" aria-label="Cari chat" autocomplete="off"></div><div class="mk-chips" id="mkCChips"></div><div id="mkInbox"><div class="mk-loadm"><i class="mk-spin"></i></div></div><div style="height:90px"></div></section>`;
  }
  function chatBoot() {
    CH.inbox = []; CH.cur = null; CH.states = {}; stopRealtime(); clearTimeout(inboxT);
    const q = $('#mkCq'); if (q) q.addEventListener('input', () => { CH.q = q.value; paintInbox(); });
    if (!me) { paintInbox(); return; }
    loadAdmins(); loadFee(); loadInbox(); startRealtime();
  }
  function chatRootClick(e) {
    const r = e.target.closest('[data-chat]'); if (r) { openChat(r.dataset.chat); return true; }
    const f = e.target.closest('[data-cf]'); if (f) { CH.filter = f.dataset.cf; paintInbox(); return true; }
    return false;
  }

  /* ---------- boot ---------- */
  MK.mount = function (host, user) {
    H = host; me = user;
    if (!root) {
      root = document.createElement('div'); root.id = 'mk'; root.className = 'mk-hide'; document.body.append(root);
      root.addEventListener('pointerdown', ripple, { passive: true }); root.addEventListener('click', onRootClick);
      try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { }
      document.addEventListener('visibilitychange', () => { if (!document.hidden && root && !root.classList.contains('mk-hide')) ping(); else flushViews(); });
      window.addEventListener('pagehide', flushViews);
    }
    applyTheme();
    if (root._uid !== (me && me.id)) { root._uid = me && me.id; Object.assign(S, { tab: 'pasar', posts: [], end: false, stores: null, mine: null, newer: 0, tmp: [], q: '', game: '', _mineFresh: 0 }); shell(); paintNavAdmin(); chatBoot(); loadFeed(true); loadGames(); }
    return root;
  };
  MK.show = function () { root.hidden = false; void root.offsetWidth; root.classList.remove('mk-hide'); ping(); if (me && me.kind === 'member') setTimeout(MK.reconcile, 600); };
  MK.hide = function () { if (!root) return; root.classList.add('mk-hide'); flushViews(); clearTimeout(pingT); setTimeout(() => { if (root.classList.contains('mk-hide')) root.hidden = true; }, 340); };
  MK.root = () => root;
  MK.closeAllPages = () => { [...S.pages].reverse().forEach(p => p.close()); };
  MK.splash = function (ms = 700) { const s = document.createElement('div'); s.className = 'mk-splash'; s.innerHTML = `${LOGO()}<div class="mk-from">dari<b>JB KU</b></div>`; root.append(s); setTimeout(() => { s.classList.add('out'); setTimeout(() => s.remove(), 400); }, ms); };
  MK._ = { $, $$, E, ic, LOGO, toast, rpc, rest, LS, errMsg, applyTheme: () => applyTheme(), setRoot: r => { root = r; } };
})();
</script>
<script>
/* ===== JB KU MARKET — website untuk anak JB (guest @namastore, tanpa verifikasi) ===== */
(() => {
  const { LS, E, LOGO, ic, rpc, errMsg, toast } = MK._;
  const stack = []; let guard = true, fromPop = false;
  try { history.replaceState({ mk: 0 }, ''); history.pushState({ mk: 1 }, ''); } catch (e) { }
  addEventListener('popstate', () => {
    const top = stack[stack.length - 1];
    if (top) { fromPop = true; try { top.close(); } finally { fromPop = false; } try { history.pushState({ mk: 1 }, ''); } catch (e) { } }
    else guard = false;
  });
  const host = {
    mode: 'web',
    backPush: api => { stack.push(api); if (!guard) { guard = true; try { history.pushState({ mk: 1 }, ''); } catch (e) { } } },
    backPop: api => { const i = stack.indexOf(api); if (i >= 0) stack.splice(i, 1); void fromPop; },
    goBack: api => api.close(),
    link: () => location.origin + location.pathname,
    stocks: () => [], specs: () => [],
    badge: n => { document.title = (n ? '(' + (n > 99 ? '99+' : n) + ') ' : '') + 'JB KU Market'; },
    notify: (t, b) => { try { if (window.Notification && Notification.permission === 'granted') new Notification(t, { body: b, tag: 'mk-chat' }); } catch (e) { } },
    themeColor: c => { const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = c; },
    logout: async () => {
      const ok = await new Promise(res => { const r = MK.root(), ov = document.createElement('div'); ov.className = 'mk-sh'; ov.innerHTML = `<div class="mk-shb"><div class="mk-grab"></div><h3>Keluar dari akun guest?</h3><p>Kamu bisa masuk lagi kapan saja dengan nama store yang sama.</p><div class="mk-row2"><button class="mk-btn ghost" data-s="0">Batal</button><button class="mk-btn bad" data-s="1">Keluar</button></div></div>`; r.append(ov); ov.addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (e.target === ov || b) { ov.remove(); res(!!b && b.dataset.s === '1'); } }); });
      if (!ok) return; LS.set('mk_guest', null); try { sessionStorage.removeItem('mk_in'); } catch (e) { } location.replace(location.pathname);
    }
  };
  const clean = s => String(s || '').trim().replace(/^@+/, '').replace(/\s+/g, '').replace(/[^A-Za-z0-9_.]/g, '').slice(0, 24);
  const asUser = g => ({ id: 'g_' + g.id, kind: 'guest', name: '@' + (g.name || g.handle), avatar: g.avatar || '', wa: LS.get('mk_gwa', ''), admin: false });
  const root = MK.mount(host, null); MK.show();
  MK.splash(900);

  async function enter(g, count) {
    if (count) { try { const r = await rpc('mk_guest_login', { p_handle: g.handle, p_name: g.name }); if (r && r.id) g = { id: r.id, handle: r.handle, name: r.name }; LS.set('mk_guest', g); sessionStorage.setItem('mk_in', '1'); } catch (e) { } }
    MK.mount(host, asUser(g)); MK.show();
  }
  function welcome() {
    const w = document.createElement('div'); w.className = 'mk-wel';
    w.innerHTML = `<div class="mk-fx" style="display:flex;flex-direction:column;align-items:center;flex:1;width:100%"><div class="mk-hero"><i style="width:22px;height:22px;top:14%;left:12%"></i><i style="width:14px;height:14px;bottom:18%;right:14%"></i><i style="width:10px;height:10px;top:22%;right:20%"></i>${LOGO()}</div>
<h1>Selamat datang di JB KU Market</h1><p>Tempat anak JB cari &amp; jual akun game. Posting akun sepuasnya, lihat stok toko lain, dan transaksi aman lewat rekber admin terverifikasi.</p>
<p>Ketuk "Setuju dan lanjutkan" untuk menerima <b>Ketentuan Market</b>: dilarang menipu, selalu gunakan rekber admin, jangan pernah kirim kode OTP.</p><span class="mk-sp"></span>
<button class="mk-btn mk-rp" data-w="go">Setuju dan lanjutkan</button></div>`;
    root.append(w);
    w.addEventListener('click', e => { if (e.target.closest('[data-w="go"]')) { w.remove(); login(); } });
  }
  function login() {
    const w = document.createElement('div'); w.className = 'mk-wel';
    w.innerHTML = `<div class="mk-fx" style="display:flex;flex-direction:column;align-items:center;flex:1;width:100%"><h2>Masukkan nama store</h2><p>JB KU Market akan membuat akun guest dengan nama store kamu. Langsung masuk, tanpa verifikasi.</p>
<label class="mk-at"><span>@</span><input id="mkN" autocomplete="nickname" autocapitalize="off" spellcheck="false" maxlength="24" placeholder="Namastore" aria-label="Nama store"></label><div class="mk-err" id="mkE"></div>
<p style="font-size:13px">Huruf, angka, titik &amp; garis bawah. Contoh: <b>@RenStore</b></p><span class="mk-sp"></span>
<button class="mk-btn mk-rp" data-w="in" disabled>Lanjut</button></div>`;
    root.append(w);
    const i = w.querySelector('#mkN'), b = w.querySelector('[data-w="in"]'), er = w.querySelector('#mkE');
    setTimeout(() => i.focus(), 300);
    i.addEventListener('input', () => { const c = clean(i.value); if (c !== i.value) i.value = c; b.disabled = c.length < 3; er.textContent = c && c.length < 3 ? 'Minimal 3 karakter' : ''; });
    i.addEventListener('keydown', e => { if (e.key === 'Enter' && !b.disabled) b.click(); });
    b.addEventListener('click', async () => {
      const n = clean(i.value); if (n.length < 3) return;
      b.disabled = true; b.innerHTML = '<i class="mk-spin" style="width:20px;height:20px;border-width:2.5px;border-color:rgba(255,255,255,.4);border-top-color:#fff"></i>';
      try {
        const r = await rpc('mk_guest_login', { p_handle: n.toLowerCase(), p_name: n });
        const g = { id: r.id, handle: r.handle, name: r.name || n }; LS.set('mk_guest', g); try { sessionStorage.setItem('mk_in', '1'); } catch (e) { }
        w.style.transition = 'opacity .3s'; w.style.opacity = 0; setTimeout(() => w.remove(), 300);
        await enter(g, false); toast(`Masuk sebagai @${g.name} ✓`);
      } catch (e) { er.textContent = errMsg(e); b.disabled = false; b.textContent = 'Lanjut'; }
    });
  }
  const g = LS.get('mk_guest', null);
  setTimeout(() => { if (g && g.id) { let fresh = true; try { fresh = !sessionStorage.getItem('mk_in'); } catch (e) { } enter(g, fresh); } else welcome(); }, 250);
  void E; void ic;
})();
</script>
